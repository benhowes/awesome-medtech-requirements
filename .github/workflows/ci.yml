name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly full link check
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --python 3.12 --with pytest --with requests --with click pytest -q tests

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Check new links (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          git show "origin/${{ github.base_ref }}:README.md" > "$RUNNER_TEMP/base.md"
          uv run scripts/check_links.py README.md --base "$RUNNER_TEMP/base.md"
      - name: Check all links
        if: github.event_name != 'pull_request'
        run: uv run scripts/check_links.py README.md
